[project]
name = "vibebase"
version = "0.1.0"
description = "Pyproject settings and dependencies for Vibebase formatter, linter, and type checker used in CLAUDE, git, vscode"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pyright>=1.1.403",
    "ruff>=0.12.5",
    "mypy>=1.7.0",
    "debugpy>=1.8.15",
]

[tool.ruff]
line-length = 100
exclude = [
    "core/db/alembic",
    "frontend",
    "hooks",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]  # Let formatter handle line length

[tool.pyright]
include = ["core"]
exclude = ["**/__pycache__", "**/.venv", "**/tests", "core/db/alembic"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
exclude = [
    "core/db/alembic",
    "frontend",
    "hooks",
]
