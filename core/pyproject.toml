[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api"]

[project]
name = "vibebase-core"
version = "0.1.0"
description = "Core backend services for Vibebase"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "asyncpg>=0.29.0",
    "pydantic[email]>=2.5.0",
    "pydantic-settings>=2.1.0",
    "PyJWT>=2.8.0",
    "slowapi>=0.1.9",
    "httpx>=0.25.0",
    "python-dotenv[cli]>=1.0.0",
    "psycopg2-binary>=2.9.10",
]

[project.optional-dependencies]
aws = ["aioboto3>=12.3.0"]
ai = ["openai>=1.86.0"]

[dependency-groups]
dev = [
    "alembic>=1.16.1",
    "asyncpg>=0.30.0",
    "debugpy>=1.8.15",
]
